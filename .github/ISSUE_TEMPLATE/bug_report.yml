name: Bug report
description: A crash, a rendering problem, or other behaviour that looks wrong
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach game files, dumps, extracted assets, keys, or logs containing paths to them.**
        A short log excerpt around the failure is enough.

  - type: input
    id: gpu
    attributes:
      label: GPU and driver
      placeholder: NVIDIA RTX 3070, driver 566.36
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 (26100)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Loader / startup
        - Shader translation
        - D3D12 / rendering
        - DXR / ray tracing
        - Audio
        - Input
        - Performance
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you ran, and what happened.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Relevant log
      description: Paste only the lines around the failure. Remove personal paths.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: policy
    attributes:
      label: Asset policy
      options:
        - label: I have not attached any game files, dumps, extracted assets, keys, or logs containing paths to them.
          required: true
