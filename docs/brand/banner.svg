<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sixth Star</title>
  <desc id="desc">A Windows compatibility layer for Xbox Series X|S titles</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B18"/>
      <stop offset="1" stop-color="#111A33"/>
    </linearGradient>
    <linearGradient id="star" x1="120" y1="60" x2="300" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="rule" x1="300" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="card">
      <rect width="1280" height="320" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <circle cx="1120" cy="40" r="240" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="2"/>
    <circle cx="1120" cy="40" r="180" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2"/>
    <path d="M1040 250 L1062 210 L1084 250 L1062 290 Z" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="930" cy="76" r="2.5" fill="#FFFFFF" fill-opacity="0.35"/>
    <circle cx="1184" cy="190" r="2" fill="#FFFFFF" fill-opacity="0.3"/>
    <circle cx="1010" cy="150" r="1.5" fill="#5EEAD4" fill-opacity="0.55"/>
    <circle cx="1210" cy="76" r="1.5" fill="#60A5FA" fill-opacity="0.5"/>
    <g transform="translate(96 80) scale(0.625)" filter="url(#glow)">
      <circle cx="128" cy="128" r="92" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
      <path d="M128 36 L210 178 H46 Z" fill="url(#star)" fill-opacity="0.16" stroke="url(#star)" stroke-width="9" stroke-linejoin="round"/>
      <path d="M128 220 L46 78 H210 Z" fill="url(#star)" fill-opacity="0.16" stroke="url(#star)" stroke-width="9" stroke-linejoin="round"/>
      <circle cx="128" cy="128" r="12" fill="#E0F2FE"/>
    </g>
    <text x="300" y="140" fill="#F8FAFC" font-family="ui-sans-serif, 'Segoe UI', Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="3">SIXTH STAR</text>
    <text x="302" y="188" fill="#93C5FD" font-family="ui-sans-serif, 'Segoe UI', Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="1.5">XBOX SERIES X|S  →  WINDOWS</text>
    <rect x="302" y="212" width="460" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="302" y="254" fill="#94A3B8" font-family="ui-sans-serif, 'Segoe UI', Arial, sans-serif" font-size="19">A GDK compatibility layer. Your files. Your PC.</text>
  </g>
</svg>
