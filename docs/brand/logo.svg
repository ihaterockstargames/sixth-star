<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Sixth Star mark</title>
  <desc id="desc">A six-pointed star in a rounded dark square</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B18"/>
      <stop offset="1" stop-color="#141F3D"/>
    </linearGradient>
    <linearGradient id="star" x1="58" y1="44" x2="198" y2="212" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="92" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
  <g filter="url(#glow)">
    <path d="M128 36 L210 178 H46 Z" fill="url(#star)" fill-opacity="0.16" stroke="url(#star)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M128 220 L46 78 H210 Z" fill="url(#star)" fill-opacity="0.16" stroke="url(#star)" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <circle cx="128" cy="128" r="12" fill="#E0F2FE"/>
</svg>
