[package]
name = "membench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "B-30: synthetic GPU memory-backing benchmark (VRAM vs system memory vs title memory opened as a heap). No game data."

[dependencies]
victory-shader.workspace = true
sixth-memory.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
